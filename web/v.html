<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Live Call Text</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%232453d6'/%3E%3Cpath d='M10 10h16a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-9l-5 4v-4h-2a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z' fill='%23fff'/%3E%3Cpath d='M14 15v4M18 13.5v7M22 15v4' stroke='%232453d6' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/viewer.css">
</head>
<body class="viewer-page">
  <div class="v-app">

    <header class="v-bar">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
          <rect width="36" height="36" rx="10" fill="#2453d6"/>
          <path d="M10 10h16a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-9l-5 4v-4h-2a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3z" fill="#fff"/>
          <path d="M14 15v4M18 13.5v7M22 15v4" stroke="#2453d6" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div>
          <h1>Live Call Text</h1>
          <p class="tagline">Your agent's words, live</p>
        </div>
      </div>
    </header>

    <div class="status-chip v-status" data-testid="v-status" data-state="connecting" role="status">
      <span class="en">Connecting...</span>
      <span class="ur" lang="ur" dir="rtl">رابطہ ہو رہا ہے...</span>
    </div>

    <main class="v-transcript" data-testid="v-transcript" role="log" aria-live="polite">
      <div class="empty-state v-empty">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 9h28a5 5 0 0 1 5 5v14a5 5 0 0 1-5 5H22l-8 6v-6h-4a5 5 0 0 1-5-5V14a5 5 0 0 1 5-5z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M17 18v6M24 15.5v11M31 18v6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
        <p class="empty-title">The agent's words will appear here</p>
        <p class="urdu" lang="ur" dir="rtl">ایجنٹ کی بات یہاں لکھی آئے گی</p>
      </div>
    </main>

    <footer class="v-foot">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <div>
        <p>Only the agent's words are shown. Nothing is recorded.</p>
        <p class="urdu" lang="ur" dir="rtl">صرف ایجنٹ کی بات دکھائی جاتی ہے۔ کچھ بھی ریکارڈ نہیں ہوتا۔</p>
      </div>
    </footer>

  </div>
  <script type="module" src="js/viewer.js"></script>
</body>
</html>
